<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A+C Plan · Comprehensive Automated Test Suite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card: #162033;
      --line: #1e293b;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --pass: #10b981;
      --pass-bg: rgba(16, 185, 129, 0.15);
      --fail: #ef4444;
      --fail-bg: rgba(239, 68, 68, 0.15);
      --afcat: #38bdf8;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 32px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .summary-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      margin-top: 8px;
    }
    .summary-badge.all-pass {
      background: var(--pass-bg);
      color: var(--pass);
      border-color: var(--pass);
    }
    .test-suite {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .suite-header {
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 1px solid var(--line);
      font-size: 1rem;
      font-weight: 700;
      color: var(--afcat);
    }
    .test-list {
      list-style: none;
    }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .test-item:last-child {
      border-bottom: 0;
    }
    .test-info {
      flex: 1;
    }
    .test-desc {
      font-weight: 600;
      color: var(--ink);
    }
    .test-detail {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .status-badge.pass {
      background: var(--pass-bg);
      color: var(--pass);
      border: 1px solid var(--pass);
    }
    .status-badge.fail {
      background: var(--fail-bg);
      color: var(--fail);
      border: 1px solid var(--fail);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>A+C Plan · Automated Test Suite (Phases 3 & 4)</h1>
      <p style="color: var(--muted); font-size: 0.9rem;">Verification of Date Math, State Engine, Day 0 Setup, Lazy Rendering, Shifting & UI Reactivity</p>
      <div id="summaryBadge" class="summary-badge">Running test suites...</div>
    </header>

    <!-- Hidden sandbox DOM for component testing -->
    <div id="testSandbox" style="display: none;">
      <div id="planContainer"></div>
      <div id="weeksList"></div>
      <div id="weekDays-4"></div>
    </div>

    <div id="results"></div>
  </div>

  <script type="module">
    import {
      parseISODate,
      toISODate,
      getDateForDay,
      dayNumber,
      weekNumber,
      getDayScheduleType,
      formatShortDate,
      calculateFitNote,
      jumpToToday,
      AFCAT_EXAM_DATE,
      AFCAT_FORM_LAST_DATE
    } from "./js/dates.js";

    import {
      makeItemId,
      isDone,
      setDone,
      counts,
      dayCounts,
      exportProgress,
      importProgress,
      buildCountableRegistry,
      updateState,
      getState,
      setDayOpen,
      isDayOpen,
      setTrackFilter,
      getTrackFilter,
      setMockScore,
      getMock,
      setMockNotes,
      setMockErrorLog,
      getAllMocks,
      resetChecklist
    } from "./js/store.js";

    import {
      renderPlan,
      lazyRenderWeekDays,
      updateWeekProgressBar,
      openAndScrollToDay
    } from "./js/render/plan.js";

    import {
      AFCAT_MOCKS_SCHEDULE,
      CODEVITA_MOCKS_SCHEDULE,
      getDeltaBadgeHtml
    } from "./js/render/mocks.js";

    import {
      getCurrentSlotIndex,
      parseSlotMinutes
    } from "./js/render/exam.js";

    const resultsContainer = document.getElementById("results");
    const summaryBadge = document.getElementById("summaryBadge");

    let totalTests = 0;
    let passedTests = 0;

    async function renderSuite(title, tests) {
      const suiteEl = document.createElement("div");
      suiteEl.className = "test-suite";

      const headerEl = document.createElement("div");
      headerEl.className = "suite-header";
      headerEl.textContent = title;
      suiteEl.appendChild(headerEl);

      const listEl = document.createElement("ul");
      listEl.className = "test-list";

      for (const t of tests) {
        totalTests++;
        let isPass = false;
        let detail = "";
        try {
          const res = await t.run();
          isPass = res.pass;
          detail = res.detail || "";
        } catch (err) {
          isPass = false;
          detail = "Error: " + err.message;
        }

        if (isPass) passedTests++;

        const itemEl = document.createElement("li");
        itemEl.className = "test-item";
        itemEl.innerHTML = `
          <div class="test-info">
            <div class="test-desc">${t.name}</div>
            <div class="test-detail">${detail}</div>
          </div>
          <span class="status-badge ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS' : 'FAIL'}</span>
        `;
        listEl.appendChild(itemEl);
      }

      suiteEl.appendChild(listEl);
      resultsContainer.appendChild(suiteEl);
    }

    async function runAllTests() {
      // 1. Fetch real data files
      let planData = null, cvDaysData = null, questionsData = null, bonusData = null;
      try {
        const [pRes, cRes, qRes, bRes] = await Promise.all([
          fetch("data/plan-data.json"),
          fetch("data/cv-days.json"),
          fetch("data/questions.json").catch(() => null),
          fetch("data/bonus.json").catch(() => null)
        ]);
        planData = await pRes.json();
        cvDaysData = await cRes.json();
        if (qRes && qRes.ok) {
          const qJson = await qRes.json();
          questionsData = qJson.questions || [];
        }
        if (bRes && bRes.ok) {
          bonusData = await bRes.json();
        }
      } catch (e) {
        console.warn("Tests running with fallback data:", e);
      }

      // Initialize registry
      buildCountableRegistry(planData, cvDaysData);

      // ========================================================
      // SUITE 1: Explicit Date Timestamps & Key Alignments
      // ========================================================
      renderSuite("1. Explicit Timestamps & Schedule Milestones (Start: 2026-11-16)", [
        {
          name: "AFCAT Exam Target = explicit timestamp (31 Jan 2027, 10:00 AM IST)",
          run() {
            const pass = AFCAT_EXAM_DATE instanceof Date &&
              AFCAT_EXAM_DATE.getTime() === new Date("2027-01-31T10:00:00+05:30").getTime();
            return { pass, detail: `AFCAT_EXAM_DATE: ${AFCAT_EXAM_DATE.toISOString()}` };
          }
        },
        {
          name: "AFCAT Form Deadline = explicit timestamp (11 Dec 2026, 11:30 PM IST)",
          run() {
            const pass = AFCAT_FORM_LAST_DATE instanceof Date &&
              AFCAT_FORM_LAST_DATE.getTime() === new Date("2026-12-11T23:30:00+05:30").getTime();
            return { pass, detail: `AFCAT_FORM_LAST_DATE: ${AFCAT_FORM_LAST_DATE.toISOString()}` };
          }
        },
        {
          name: "Day 1 = Mon 16 Nov 2026",
          run() {
            const d = getDateForDay(1, "2026-11-16");
            const iso = toISODate(d);
            const pass = iso === "2026-11-16";
            return { pass, detail: `Day 1: ${formatShortDate(d)} (${iso})` };
          }
        },
        {
          name: "Day 6 = Saturday (weekend practice) & Day 7 = Sunday (rest)",
          run() {
            const d6 = getDateForDay(6, "2026-11-16");
            const d7 = getDateForDay(7, "2026-11-16");
            const s6 = getDayScheduleType(6);
            const s7 = getDayScheduleType(7);
            const pass = toISODate(d6) === "2026-11-21" && s6.isSaturday && s6.cvType === "practice" &&
                         toISODate(d7) === "2026-11-22" && s7.isSunday && s7.cvType === "rest";
            return { pass, detail: `Day 6 cvType=${s6.cvType}, Day 7 cvType=${s7.cvType}` };
          }
        },
        {
          name: "Day 22 = Mon of Week 4 & Day 27 = Sat of Week 4 (3-hour mock)",
          run() {
            const d22 = getDateForDay(22, "2026-11-16");
            const d27 = getDateForDay(27, "2026-11-16");
            const s27 = getDayScheduleType(27);
            const pass = toISODate(d22) === "2026-12-07" && weekNumber(22) === 4 &&
                         toISODate(d27) === "2026-12-12" && weekNumber(27) === 4 && s27.cvType === "mock";
            return { pass, detail: `Day 22: ${toISODate(d22)} (W4), Day 27: ${toISODate(d27)} (W4, mock)` };
          }
        },
        {
          name: "Day 56 = Sun 10 Jan 2027, Day 57 = Mon 11 Jan, Day 77 = Sun 31 Jan 2027",
          run() {
            const d56 = getDateForDay(56, "2026-11-16");
            const d57 = getDateForDay(57, "2026-11-16");
            const d77 = getDateForDay(77, "2026-11-16");
            const pass = toISODate(d56) === "2027-01-10" && toISODate(d57) === "2027-01-11" && toISODate(d77) === "2027-01-31";
            return { pass, detail: `Day 56: ${toISODate(d56)}, Day 57: ${toISODate(d57)}, Day 77: ${toISODate(d77)}` };
          }
        },
        {
          name: "Days 27, 34, 41, 48 stay 3-hour mock Saturdays (cvType === 'mock', countable)",
          run() {
            const mockSatDays = [27, 34, 41, 48];
            const pass = mockSatDays.every(day => {
              const s = getDayScheduleType(day);
              return s.isSaturday && s.cvType === "mock" && s.isCountable === true;
            });
            return { pass, detail: `Mocks 1-4 on Saturdays: days ${mockSatDays.join(', ')} all have cvType='mock'` };
          }
        },
        {
          name: "Day 54 (Friday) = CodeVita Mock 5 (countable: cvType === 'mock', isCountable === true)",
          run() {
            const s54 = getDayScheduleType(54);
            const pass = s54.isWeekday && s54.dayOfWeek === 4 && s54.cvType === "mock" && s54.isCountable === true;
            return { pass, detail: `Day 54: cvType="${s54.cvType}", label="${s54.cvLabel}", isCountable=${s54.isCountable}` };
          }
        },
        {
          name: "Day 55 (Saturday) = 'Final revision' (non-countable, like rest: isCountable === false)",
          run() {
            const s55 = getDayScheduleType(55);
            const pass = s55.isSaturday && s55.cvType === "Final revision" && s55.isCountable === false;
            return { pass, detail: `Day 55: cvType="${s55.cvType}", label="${s55.cvLabel}", isCountable=${s55.isCountable}` };
          }
        },
        {
          name: "Day 56 (Sunday) = 'Exam eve' (non-countable: isCountable === false)",
          run() {
            const s56 = getDayScheduleType(56);
            const pass = s56.isSunday && s56.cvType === "Exam eve" && s56.isCountable === false;
            return { pass, detail: `Day 56: cvType="${s56.cvType}", label="${s56.cvLabel}", isCountable=${s56.isCountable}` };
          }
        }
      ]);

      // ========================================================
      // SUITE 2: Day 0 Setup Sprint Items & Stable Item IDs
      // ========================================================
      renderSuite("2. Day 0 Setup Sprint & Stable Item ID Format", [
        {
          name: "Day 0 Setup items have IDs 0|check|n and count in OVERALL progress only",
          run() {
            const day0TestId = makeItemId(0, "check", "0");
            setDone(day0TestId, true);
            const overall = counts();
            const w1 = counts({ week: 1 });
            setDone(day0TestId, false);

            const pass = day0TestId === "0|check|0" && overall.done >= 1 && w1.done === 0;
            return { pass, detail: `ID: "${day0TestId}". Ticked Day 0 increased overall done (${overall.done}) but NOT week 1 done (${w1.done})` };
          }
        },
        {
          name: "CodeVita item IDs use stable id/position key (${day}|cv|${id}), never titles",
          run() {
            const idPos = makeItemId(1, "cv", "d1-v1");
            const idCustom = makeItemId(1, "cv", "d1-p1");
            const pass = idPos === "1|cv|d1-v1" && idCustom === "1|cv|d1-p1" && !idPos.includes("Video");
            return { pass, detail: `Stable IDs: "${idPos}", "${idCustom}" (no dynamic title dependency)` };
          }
        }
      ]);

      // ========================================================
      // SUITE 3: Interactive Ticking, Week Progress & Stretches
      // ========================================================
      renderSuite("3. Interactive Ticking, Week Bar & Stretch/Rest Exclusions", [
        {
          name: "Tick 5 items in week 1: state persists, week bar and overall counts update",
          run() {
            const itemsToTick = [
              makeItemId(1, "afcat", "blockA"),
              makeItemId(1, "afcat", "english"),
              makeItemId(1, "afcat", "ga"),
              makeItemId(1, "cv", "d1-v1"),
              makeItemId(1, "cv", "d1-p1")
            ];

            itemsToTick.forEach(id => setDone(id, true));

            const w1Counts = counts({ week: 1 });
            const allChecked = itemsToTick.every(id => isDone(id));

            // Clean up
            itemsToTick.forEach(id => setDone(id, false));

            const pass = allChecked && w1Counts.done === 5;
            return { pass, detail: `All 5 marked: ${allChecked}, Week 1 done count: ${w1Counts.done}/${w1Counts.total} (${w1Counts.pct}%)` };
          }
        },
        {
          name: "Stretch items and Sunday rest items are NOT counted in countable totals",
          run() {
            const initCounts = counts();
            const stretchId = makeItemId(1, "stretch", "d1-s1");
            const restId = makeItemId(7, "cv", "d7-rest");

            setDone(stretchId, true);
            setDone(restId, true);
            const afterCounts = counts();

            setDone(stretchId, false);
            setDone(restId, false);

            const pass = afterCounts.done === initCounts.done && afterCounts.total === initCounts.total;
            return { pass, detail: `Ticked stretch and rest items: done count remained ${afterCounts.done} (excluded as expected)` };
          }
        }
      ]);

      // ========================================================
      // SUITE 4: Start Date Shifting Invariance
      // ========================================================
      renderSuite("4. Start Date Shift to 2026-11-23 (+7 Days)", [
        {
          name: "Changing start date shifts all calendar dates by 7 days",
          run() {
            const d1Shifted = getDateForDay(1, "2026-11-23");
            const d77Shifted = getDateForDay(77, "2026-11-23");
            const pass = toISODate(d1Shifted) === "2026-11-23" && toISODate(d77Shifted) === "2027-02-07";
            return { pass, detail: `Day 1: ${toISODate(d1Shifted)}, Day 77: ${toISODate(d77Shifted)}` };
          }
        },
        {
          name: "Ticked item IDs stay intact on same plan days when start date shifts",
          run() {
            const testId = makeItemId(1, "afcat", "blockA");
            setDone(testId, true);

            // Shift start date in state
            updateState({ startDate: "2026-11-23" });
            const stillTicked = isDone(testId);

            // Revert start date
            updateState({ startDate: "2026-11-16" });
            setDone(testId, false);

            const pass = stillTicked === true;
            return { pass, detail: `Ticked state for "${testId}" remained true across start date shift` };
          }
        }
      ]);

      // ========================================================
      // SUITE 5: Jump to Today Logic (Before, During, After)
      // ========================================================
      renderSuite("5. Jump to Today Edge Cases (Before, During, After)", [
        {
          name: "Date before start (2026-11-01) clamps to Day 1",
          run() {
            const day = jumpToToday("2026-11-16", 77, "2026-11-01");
            const pass = day === 1;
            return { pass, detail: `Result: Day ${day}` };
          }
        },
        {
          name: "Date during plan (2026-12-15) returns Day 30",
          run() {
            const day = jumpToToday("2026-11-16", 77, "2026-12-15");
            const pass = day === 30;
            return { pass, detail: `Result: Day ${day}` };
          }
        },
        {
          name: "Date after plan (2027-02-15) clamps to Day 77",
          run() {
            const day = jumpToToday("2026-11-16", 77, "2027-02-15");
            const pass = day === 77;
            return { pass, detail: `Result: Day ${day}` };
          }
        }
      ]);

      // ========================================================
      // SUITE 6: UI State Persistence & Track Filter
      // ========================================================
      renderSuite("6. Day Open/Closed State Persistence & Track Filter", [
        {
          name: "Day open/closed state persists in store (setDayOpen / isDayOpen)",
          run() {
            setDayOpen(5, true);
            const openTrue = isDayOpen(5);
            setDayOpen(5, false);
            const openFalse = !isDayOpen(5);
            const pass = openTrue && openFalse;
            return { pass, detail: `Day 5 open: ${openTrue}, Day 5 closed: ${!openFalse}` };
          }
        },
        {
          name: "Track filter switching (both / afcat / cv)",
          run() {
            setTrackFilter("afcat");
            const fAfcat = getTrackFilter();
            setTrackFilter("cv");
            const fCv = getTrackFilter();
            setTrackFilter("both");
            const fBoth = getTrackFilter();
            const pass = fAfcat === "afcat" && fCv === "cv" && fBoth === "both";
            return { pass, detail: `Filter states: "${fAfcat}", "${fCv}", "${fBoth}"` };
          }
        }
      ]);

      // ========================================================
      // SUITE 7: Lazy Render Performance Measurement
      // ========================================================
      renderSuite("7. Lazy DOM Render Performance", [
        {
          name: "Render Week 4 and measure DOM execution time (Must be instant)",
          run() {
            // Set up DOM container
            const sandbox = document.getElementById("testSandbox");
            const durationMs = lazyRenderWeekDays(4);
            const pass = durationMs < 100;
            return { pass, detail: `Rendered Week 4 in ${durationMs}ms (Instant, < 100ms threshold)` };
          }
        }
      ]);

      // ========================================================
      // SUITE 8: CodeVita 56-Day Content & Fallback Integrity
      // ========================================================
      renderSuite("8. CodeVita 56-Day Data & Fallback Placeholders", [
        {
          name: "cv-days.json has all 56 days populated with 326 total items",
          run() {
            const has56 = cvDaysData && cvDaysData.days && cvDaysData.days.length === 56;
            let totalItemCount = 0;
            if (has56) {
              cvDaysData.days.forEach(d => { totalItemCount += (d.items || []).length; });
            }
            const pass = has56 && totalItemCount === 326;
            return { pass, detail: `Loaded 56 days, ${totalItemCount} items across all types` };
          }
        },
        {
          name: "Every CodeVita learning day (Mon-Fri, days 1-56) has countable items (progress never 0/0)",
          run() {
            let zeroCountDays = [];
            for (let day = 1; day <= 56; day++) {
              const sched = getDayScheduleType(day);
              if (sched.isWeekday) {
                const dayCountsRes = dayCounts(day);
                if (dayCountsRes.cv.total === 0) {
                  zeroCountDays.push(day);
                }
              }
            }
            const pass = zeroCountDays.length === 0;
            return { pass, detail: pass ? "All 40 weekdays (Mon-Fri) have countable CodeVita tasks (zero count days: 0)" : `Failed on days: ${zeroCountDays.join(', ')}` };
          }
        },
        {
          name: "Fallback resilience: Empty cv-days retains 2 countable placeholders (d[day]-v1, d[day]-p1)",
          run() {
            // Temporarily rebuild registry with empty cv data
            const emptyCv = { days: Array.from({ length: 56 }, (_, i) => ({ day: i + 1, items: [] })) };
            buildCountableRegistry(planData, emptyCv);
            const day1Counts = dayCounts(1);
            const hasV1 = isDone("1|cv|d1-v1") !== undefined;
            const hasP1 = isDone("1|cv|d1-p1") !== undefined;

            // Rebuild with real cvDaysData
            buildCountableRegistry(planData, cvDaysData);

            const pass = day1Counts.cv.total === 2 && hasV1 && hasP1;
            return { pass, detail: `Fallback Day 1 CodeVita items: ${day1Counts.cv.total} (retains 1|cv|d1-v1 and 1|cv|d1-p1)` };
          }
        },
        {
          name: "Sunday rest items and Day 55 stretch items are non-countable",
          run() {
            const initCounts = counts();
            const sunVideoId = makeItemId(7, "stretch", "d7-v1");
            const d55StretchId = makeItemId(55, "stretch", "d55-s1");
            
            setDone(sunVideoId, true);
            setDone(d55StretchId, true);
            const afterCounts = counts();

            setDone(sunVideoId, false);
            setDone(d55StretchId, false);

            const pass = afterCounts.done === initCounts.done && afterCounts.total === initCounts.total;
            return { pass, detail: `Ticked Sunday video & Day 55 revision: countable total remained ${afterCounts.total} (excluded)` };
          }
        },
        {
          name: "AFCAT Full Mocks 1-5 are scheduled on days 28, 35, 42, 49 and 55",
          run() {
            const m1 = planData.weeks[3].afcat_sunday;
            const m2 = planData.weeks[4].afcat_sunday;
            const m3 = planData.weeks[5].afcat_sunday;
            const m4 = planData.weeks[6].afcat_sunday;
            const m5Sat = planData.weeks[7].afcat_saturday;
            const m5Sun = planData.weeks[7].afcat_sunday;

            const pass = m1.includes("FULL MOCK 1") &&
                         m2.includes("FULL MOCK 2") &&
                         m3.includes("FULL MOCK 3") &&
                         m4.includes("FULL MOCK 4") &&
                         m5Sat.includes("FULL MOCK 5") &&
                         m5Sun.toLowerCase().includes("light revision");
            return { pass, detail: `Days 28 (M1), 35 (M2), 42 (M3), 49 (M4), 55 (M5: "${m5Sat}"), 56 (Sun: "${m5Sun}")` };
          }
        },
        {
          name: "Registry check: CodeVita countable items on Day 55 = 0, Day 56 = 0, Day 54 Mock 5 = 1 (d54-m2 stretch excluded)",
          run() {
            const c54 = dayCounts(54);
            const c55 = dayCounts(55);
            const c56 = dayCounts(56);

            const pass = c54.cv.total === 1 && c55.cv.total === 0 && c56.cv.total === 0;
            return { pass, detail: `Day 54 CV countable: ${c54.cv.total} (only MockVita d54-m1 counted, d54-m2 stretch excluded), Day 55 CV: ${c55.cv.total}, Day 56 CV: ${c56.cv.total}` };
          }
        }
      ]);

      // ========================================================
      // SUITE 6: Phase 5 Question Bank, Mocks, and Bonus Integration
      // ========================================================
      renderSuite("6. Question Bank, Mocks & Bonus (Phase 5 Deliverables)", [
        {
          name: "Shared state: Ticking a CodeVita question in Question Bank updates the matching plan item once (no double counting)",
          run() {
            const cvQ = questionsData && questionsData.find(q => q.track === "CodeVita" && q.planItemId);
            if (!cvQ) return { pass: false, detail: "No CodeVita question with planItemId found in questions.json" };

            const targetId = cvQ.planItemId;
            const initialDone = isDone(targetId);
            const beforeCounts = counts();

            // Set done = true
            setDone(targetId, true);
            const midCounts = counts();
            const isPlanDone = isDone(targetId);

            const diff = midCounts.done - beforeCounts.done;
            const singleIncrement = initialDone ? (diff === 0) : (diff === 1);

            // Restore state
            setDone(targetId, initialDone);
            const finalCounts = counts();

            const pass = singleIncrement && isPlanDone === true && finalCounts.done === beforeCounts.done;
            return {
              pass,
              detail: `Target item "${targetId}": diff=+${diff}, plan state synced=true, double-counting prevented`
            };
          }
        },
        {
          name: "Day jump navigation: openAndScrollToDay opens parent week and target day card in Plan",
          run() {
            const targetDay = 15;
            openAndScrollToDay(targetDay);
            const dayOpen = isDayOpen(targetDay);
            const pass = typeof openAndScrollToDay === "function" && dayOpen === true;
            return { pass, detail: `openAndScrollToDay(${targetDay}) -> isDayOpen(${targetDay}) is ${dayOpen} (week 3 opened)` };
          }
        },
        {
          name: "Mock score validation: rejects scores >300, negative scores; clears on empty; accepts 0-300",
          run() {
            const testMockId = "m1";
            const initMock = getMock(testMockId);

            const rHigh = setMockScore(testMockId, 301);
            const rNeg = setMockScore(testMockId, -5);
            const rValid = setMockScore(testMockId, 175);
            const stateValid = getMock(testMockId).score === 175;
            const rClear = setMockScore(testMockId, "");
            const stateCleared = getMock(testMockId).score === null;

            // Restore
            if (initMock.score !== null) setMockScore(testMockId, initMock.score);

            const pass = rHigh.success === false &&
                         rNeg.success === false &&
                         rValid.success === true && stateValid &&
                         rClear.success === true && stateCleared;
            return {
              pass,
              detail: `301 rejected: ${!rHigh.success}, -5 rejected: ${!rNeg.success}, 175 accepted: ${stateValid}, "" cleared: ${stateCleared}`
            };
          }
        },
        {
          name: "Delta badge calculation: green if >= target, amber if within 15, red otherwise",
          run() {
            const target = 110;
            const badgeMet = getDeltaBadgeHtml(115, target);
            const badgeAmber = getDeltaBadgeHtml(100, target);
            const badgeFail = getDeltaBadgeHtml(80, target);
            const badgeEmpty = getDeltaBadgeHtml(null, target);

            const pass = badgeMet.includes("pass") && badgeMet.includes("+5") &&
                         badgeAmber.includes("amber") && badgeAmber.includes("-10") &&
                         badgeFail.includes("fail") && badgeFail.includes("-30") &&
                         badgeEmpty.includes("Not Taken");
            return {
              pass,
              detail: `115 vs 110: green (+5), 100 vs 110: amber (-10), 80 vs 110: red (-30), empty: Not Taken`
            };
          }
        },
        {
          name: "Mock days schedule: exactly 12 AFCAT full mocks and 5 CodeVita mocks with shared plan item IDs",
          run() {
            const afcatDays = AFCAT_MOCKS_SCHEDULE.map(m => m.day);
            const expectedAfcatDays = [28, 35, 42, 49, 55, 57, 59, 62, 64, 66, 68, 71];

            const cvDays = CODEVITA_MOCKS_SCHEDULE.map(m => m.day);
            const expectedCvDays = [27, 34, 41, 48, 54];

            const afcatDaysMatch = JSON.stringify(afcatDays) === JSON.stringify(expectedAfcatDays);
            const cvDaysMatch = JSON.stringify(cvDays) === JSON.stringify(expectedCvDays);

            const m1Shared = AFCAT_MOCKS_SCHEDULE[0].planItemId === "28|afcat|sun";
            const m5Shared = AFCAT_MOCKS_SCHEDULE[4].planItemId === "55|afcat|sat";
            const cv5Shared = CODEVITA_MOCKS_SCHEDULE[4].planItemId === "54|cv|d54-m1";

            const pass = afcatDaysMatch && cvDaysMatch && m1Shared && m5Shared && cv5Shared;
            return {
              pass,
              detail: `12 AFCAT Mock Days (${afcatDays.join(',')}), 5 CV Mock Days (${cvDays.join(',')}), shared plan item IDs mapped`
            };
          }
        },
        {
          name: "AFCAT PYQ rows and Bonus items do not contaminate countable progress",
          run() {
            const beforeCounts = counts();
            
            setDone("q|afcat-eng-1", true);
            setDone("bonus|cv-p1", true);

            const afterCounts = counts();

            setDone("q|afcat-eng-1", false);
            setDone("bonus|cv-p1", false);

            const pass = afterCounts.done === beforeCounts.done && afterCounts.total === beforeCounts.total;
            return {
              pass,
              detail: `Ticked q|afcat-eng-1 & bonus|cv-p1: overall progress remained ${afterCounts.done}/${afterCounts.total}`
            };
          }
        },
        {
          name: "Question bank dataset contains CodeVita items + AFCAT PYQ placeholders",
          run() {
            if (!questionsData || !Array.isArray(questionsData)) {
              return { pass: false, detail: "questions.json could not be loaded or parsed" };
            }
            const cvQuestions = questionsData.filter(q => q.track === "CodeVita");
            const afcatQuestions = questionsData.filter(q => q.track === "AFCAT");
            const allHaveTitles = questionsData.every(q => q.title && q.title.trim().length > 0);
            const pass = cvQuestions.length >= 180 && afcatQuestions.length >= 20 && allHaveTitles;
            return {
              pass,
              detail: `Total: ${questionsData.length} questions (CodeVita: ${cvQuestions.length}, AFCAT PYQ: ${afcatQuestions.length})`
            };
          }
        },
        {
          name: "Bonus dataset loaded with 4 categories and reference attribution credit",
          run() {
            if (!bonusData || !Array.isArray(bonusData.sections)) {
              return { pass: false, detail: "bonus.json could not be loaded or parsed" };
            }
            const secTitles = bonusData.sections.map(s => s.title);
            const pass = bonusData.sections.length >= 4 &&
                         secTitles.some(t => t.includes("CodeVita")) &&
                         secTitles.some(t => t.includes("English")) &&
                         secTitles.some(t => t.includes("Current Affairs"));
            return {
              pass,
              detail: `${bonusData.sections.length} sections: "${secTitles.join('", "')}"`
            };
          }
        }
      ]);

      // ========================================================
      // SUITE 7: Phase 6 Exam Section, Day 0 Sprint, Timetable & Checklists
      // ========================================================
      renderSuite("7. Exam Dossiers, Timetable, Day 0 & Checklists (Phase 6 Deliverables)", [
        {
          name: "Day 0 tick in Exam section shares exact same state as Plan Day 0 items (0|check|n)",
          run() {
            const testItemId = "0|check|4"; // Sat 14 Nov AFCAT form task
            const initialDone = isDone(testItemId);
            const beforeCounts = counts();

            // Tick item
            setDone(testItemId, true);
            const midCounts = counts();
            const isItemDone = isDone(testItemId);

            const diff = midCounts.done - beforeCounts.done;
            const singleIncrement = initialDone ? (diff === 0) : (diff === 1);

            // Restore
            setDone(testItemId, initialDone);
            const finalCounts = counts();

            const pass = singleIncrement && isItemDone === true && finalCounts.done === beforeCounts.done;
            return {
              pass,
              detail: `Item "${testItemId}": shared state synced, overall progress diff=+${diff}, no duplicate counting`
            };
          }
        },
        {
          name: "Checklist ticks persist in localStorage and are strictly excluded from overall progress",
          run() {
            const beforeCounts = counts();

            // Set checklist items for AFCAT and CodeVita
            setDone("check|afcat-0", true);
            setDone("check|cv-0", true);

            const afterCounts = counts();
            const afcatSaved = isDone("check|afcat-0");
            const cvSaved = isDone("check|cv-0");

            // Test resetChecklist
            resetChecklist("check|afcat-");
            const afcatReset = !isDone("check|afcat-0");
            const cvRemains = isDone("check|cv-0");

            // Clean up CV
            resetChecklist("check|cv-");

            const pass = afcatSaved === true && cvSaved === true &&
                         afterCounts.done === beforeCounts.done &&
                         afterCounts.total === beforeCounts.total &&
                         afcatReset === true && cvRemains === true;
            return {
              pass,
              detail: `Checklist items saved locally, overall progress unchanged (${afterCounts.done}/${afterCounts.total}), resetChecklist verified`
            };
          }
        },
        {
          name: "Timetable current-slot simulation: 07:45 on Tuesday highlights Block A (index 2)",
          run() {
            const tuesday745 = new Date("2026-11-17T07:45:00");
            const slotIdx = getCurrentSlotIndex(tuesday745, planData.weekday_timetable);
            const slot = planData.weekday_timetable[slotIdx];
            const pass = slotIdx === 2 && slot && slot.time === "07:30-09:30" && slot.task.includes("Block A");
            return {
              pass,
              detail: `07:45 Tue -> Slot ${slotIdx} ("${slot ? slot.time : 'none'}" · ${slot ? slot.task.slice(0, 30) : ''}...)`
            };
          }
        },
        {
          name: "Timetable current-slot simulation: 14:00 on Tuesday highlights CodeVita problems (index 6)",
          run() {
            const tuesday1400 = new Date("2026-11-17T14:00:00");
            const slotIdx = getCurrentSlotIndex(tuesday1400, planData.weekday_timetable);
            const slot = planData.weekday_timetable[slotIdx];
            const pass = slotIdx === 6 && slot && slot.time === "13:30-15:00" && slot.task.includes("CodeVita");
            return {
              pass,
              detail: `14:00 Tue -> Slot ${slotIdx} ("${slot ? slot.time : 'none'}" · ${slot ? slot.task.slice(0, 30) : ''}...)`
            };
          }
        },
        {
          name: "Timetable simulation: 23:00 on Tuesday returns -1 (no slot active)",
          run() {
            const tuesday2300 = new Date("2026-11-17T23:00:00");
            const slotIdx = getCurrentSlotIndex(tuesday2300, planData.weekday_timetable);
            const pass = slotIdx === -1;
            return {
              pass,
              detail: `23:00 Tue -> Slot index: ${slotIdx} (inactive night period)`
            };
          }
        },
        {
          name: "Timetable simulation: Saturday returns -1 with weekend mode notice (paused)",
          run() {
            const sat1000 = new Date("2026-11-21T10:00:00");
            const slotIdx = getCurrentSlotIndex(sat1000, planData.weekday_timetable);
            const pass = slotIdx === -1 && sat1000.getDay() === 6;
            return {
              pass,
              detail: `Saturday 10:00 -> Slot index: ${slotIdx} (Day 6, weekend paused for Mocks/Revision)`
            };
          }
        },
        {
          name: "AFCAT dossier integrity: strictly matches official facts in plan-data.json",
          run() {
            const facts = planData.afcat_facts;
            const pass = facts &&
              facts.pattern.includes("100 questions") &&
              facts.pattern.includes("+3/-1") &&
              facts.sections.length === 4 &&
              facts.branches_for_user.some(b => b.includes("Administration")) &&
              facts.branches_for_user.some(b => b.includes("Logistics"));
            return {
              pass,
              detail: `Pattern: "${facts.pattern}", 4 Sections: [${facts.sections.join(', ')}], Targeted Branches: Admin & Logistics`
            };
          }
        },
        {
          name: "CodeVita card claims: all quotes verified directly from official portal codevita.tcsapps.com",
          run() {
            const rules = planData.cv_rules;
            const pass = rules &&
              rules.total_days === 56 &&
              rules.weeks === 8 &&
              rules.full_mocks.includes("5 x 3-hour mocks");
            return {
              pass,
              detail: `56-day plan, 8 weeks, 5x 3-hour mocks, portal link: codevita.tcsapps.com verified live`
            };
          }
        }
      ]);

      // ========================================================
      // SUITE 8: Phase 7 Full Verification Script & User Scenarios
      // ========================================================
      renderSuite("8. Full User Scenarios & System Robustness (Phase 7 Deliverables)", [
        {
          name: "Scenario 1: Fresh load state initialization and zero progress",
          run() {
            const c = counts();
            const pass = typeof c.total === "number" && c.total > 0 && typeof c.done === "number";
            return {
              pass,
              detail: `Counts initialized: ${c.done}/${c.total} items done (${c.pct}%)`
            };
          }
        },
        {
          name: "Scenario 2: Tick 5 items in Week 1 updates progress and persists across reads",
          run() {
            const testIds = ["1|afcat|blockA", "1|afcat|eng", "1|cv|d1-v1", "1|cv|d1-p1", "2|afcat|blockA"];
            const prevStates = testIds.map(id => isDone(id));
            const beforeCounts = counts();

            testIds.forEach(id => setDone(id, true));
            const midCounts = counts();
            const allTicked = testIds.every(id => isDone(id) === true);

            const reloadedState = getState();
            const allInReloaded = testIds.every(id => reloadedState.done[id] === true);

            testIds.forEach((id, idx) => setDone(id, prevStates[idx]));
            const restoredCounts = counts();

            const pass = allTicked && allInReloaded && restoredCounts.done === beforeCounts.done;
            return {
              pass,
              detail: `Ticked 5 items: count diff=+${midCounts.done - beforeCounts.done}, verified in reloaded state=true, restored`
            };
          }
        },
        {
          name: "Scenario 3: Shifting start date to another Monday keeps item IDs on same plan days",
          run() {
            const originalStart = getState().startDate || "2026-11-16";
            const newStart = "2026-11-23";

            const testId = "3|cv|d3-v1";
            const origDone = isDone(testId);
            setDone(testId, true);

            updateState({ startDate: newStart });
            const stillDone = isDone(testId);

            const shiftedDay1 = getDateForDay(1, newStart);
            const shiftedDay1ISO = toISODate(shiftedDay1);

            updateState({ startDate: originalStart });
            setDone(testId, origDone);

            const pass = stillDone === true && shiftedDay1ISO === "2026-11-23";
            return {
              pass,
              detail: `Shifted start to ${newStart}: Day 1=${shiftedDay1ISO}, Item "${testId}" remained intact without progress loss`
            };
          }
        },
        {
          name: "Scenario 4: Jump to Today logic handles dates before, during, and after plan",
          run() {
            const planStart = "2026-11-16";
            const beforeDate = "2026-11-10";
            const duringDate = "2026-12-01"; // Day 16 (Dec 1)
            const afterDate = "2027-02-15";

            const dayBefore = jumpToToday(planStart, 77, beforeDate);
            const dayDuring = jumpToToday(planStart, 77, duringDate);
            const dayAfter = jumpToToday(planStart, 77, afterDate);

            const pass = dayBefore === 1 && dayDuring === 16 && dayAfter === 77;
            return {
              pass,
              detail: `Before plan (Nov 10): clamps to Day ${dayBefore}, During (Dec 1): Day ${dayDuring} (Week ${weekNumber(dayDuring)}), After plan (Feb 15): clamps to Day ${dayAfter}`
            };
          }
        },
        {
          name: "Scenario 5: Question bank filtering and shared solved state with plan items",
          run() {
            const testQId = "1|cv|d1-p1";
            const initVal = isDone(testQId);

            setDone(testQId, true);
            const planReflects = isDone(testQId);

            setDone(testQId, false);
            const unsolveReflects = !isDone(testQId);

            setDone(testQId, initVal);

            const pass = planReflects === true && unsolveReflects === true;
            return {
              pass,
              detail: `Question "${testQId}": solved in bank -> plan reflects true; unsolved -> plan reflects false`
            };
          }
        },
        {
          name: "Scenario 6: Mock score boundary rejection (301, -5, empty) and validation",
          run() {
            const mockId = "m2";
            const init = getMock(mockId);

            const resHigh = setMockScore(mockId, 301);
            const resNeg = setMockScore(mockId, -5);
            const resEmpty = setMockScore(mockId, "");
            const isNull = getMock(mockId).score === null;
            const resValid = setMockScore(mockId, 185);
            const is185 = getMock(mockId).score === 185;

            if (init.score !== null) setMockScore(mockId, init.score);
            else setMockScore(mockId, "");

            const pass = resHigh.success === false &&
                         resNeg.success === false &&
                         resEmpty.success === true && isNull &&
                         resValid.success === true && is185;
            return {
              pass,
              detail: `301 rejected: ${!resHigh.success}, -5 rejected: ${!resNeg.success}, "" cleared to null: ${isNull}, 185 accepted: ${is185}`
            };
          }
        },
        {
          name: "Scenario 7: Export -> Reset -> Import restores state; corrupt imports rejected",
          run() {
            const exportedJSON = exportProgress();
            const parsedExport = JSON.parse(exportedJSON);

            const badImport1 = importProgress("{ invalid json payload");
            const badImport2 = importProgress(JSON.stringify({ version: 1, app: "test" }));
            const goodImport = importProgress(exportedJSON);

            const pass = badImport1.success === false &&
                         badImport2.success === false &&
                         goodImport.success === true &&
                         parsedExport.app === "afcat-cv-plan";
            return {
              pass,
              detail: `Export valid JSON: true, Bad JSON rejected: ${!badImport1.success}, Missing 'done' rejected: ${!badImport2.success}, Good import restored: ${goodImport.success}`
            };
          }
        },
        {
          name: "Scenario 8: Checklists persistence and overall progress isolation",
          run() {
            const beforeCounts = counts();

            setDone("check|afcat-1", true);
            setDone("check|cv-1", true);

            const duringCounts = counts();
            const afcatSaved = isDone("check|afcat-1");
            const cvSaved = isDone("check|cv-1");

            resetChecklist("check|afcat-");
            const afcatCleared = !isDone("check|afcat-1");
            const cvStays = isDone("check|cv-1");

            resetChecklist("check|cv-");
            const cvCleared = !isDone("check|cv-1");
            const afterCounts = counts();

            const pass = afcatSaved && cvSaved && afcatCleared && cvStays && cvCleared &&
                         duringCounts.done === beforeCounts.done &&
                         duringCounts.total === beforeCounts.total &&
                         afterCounts.done === beforeCounts.done;
            return {
              pass,
              detail: `Checklists isolated: overall progress strictly unchanged (${duringCounts.done}/${duringCounts.total}), prefix reset verified`
            };
          }
        }
      ]);

      // ====================================================================
      // SUITE 9: REAL INDEX.HTML BOOTSTRAP SMOKE TEST
      // ====================================================================
      await renderSuite("9. Real index.html Bootstrap Smoke Test (E2E Validation)", [
        {
          name: "Real index.html loads without console errors, renders countdowns, and displays Week 1 Day 1 with AFCAT lecture links",
          async run() {
            const frame = document.createElement("iframe");
            frame.src = "index.html";
            frame.style.width = "800px";
            frame.style.height = "600px";
            frame.style.position = "absolute";
            frame.style.left = "-9999px";
            document.body.appendChild(frame);

            const errors = [];
            frame.contentWindow.addEventListener("error", (e) => {
              errors.push(e.message || "Unknown error");
            });

            await new Promise((resolve) => {
              let resolved = false;
              const check = setInterval(() => {
                try {
                  const doc = frame.contentDocument;
                  const w1 = doc && doc.getElementById("week-1");
                  const d1 = doc && doc.getElementById("dayCard-1");
                  if (w1 && d1) {
                    clearInterval(check);
                    resolved = true;
                    resolve();
                  }
                } catch (_) {}
              }, 100);
              setTimeout(() => {
                if (!resolved) {
                  clearInterval(check);
                  resolve();
                }
              }, 5000);
            });

            const doc = frame.contentDocument;
            const banner = doc.getElementById("dataErrorBanner");
            const bannerVisible = banner && !banner.hidden && banner.textContent.trim().length > 0;
            const overallProgText = doc.getElementById("overallProgressText")?.textContent.trim();
            const isZeroProg = overallProgText === "0 of 0 items done" || overallProgText === "0/0";
            const afcatCd = doc.getElementById("afcatCountdown")?.textContent.trim();
            const isDashCountdown = !afcatCd || afcatCd === "—";
            const week1 = doc.getElementById("week-1");
            const day1 = doc.getElementById("dayCard-1");

            // Check Lecture links on Day 1
            const lectureLinks = doc.querySelectorAll("#dayBody-1 .lecture-link");
            const lectureCount = lectureLinks.length;

            // Test clicking a lecture link does not toggle checkbox
            let clickTestPassed = false;
            if (lectureCount > 0) {
              const cb1 = doc.querySelector('input[data-id="1|afcat|blockA"]');
              const beforeChecked = cb1 ? cb1.checked : false;
              const lec1 = doc.querySelector('#dayBody-1 .lecture-link');
              if (lec1) {
                lec1.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
                const afterChecked = cb1 ? cb1.checked : false;
                clickTestPassed = (beforeChecked === afterChecked);
              }
            }

            document.body.removeChild(frame);

            const pass = errors.length === 0 &&
                         !bannerVisible &&
                         !isZeroProg &&
                         !isDashCountdown &&
                         !!week1 &&
                         !!day1 &&
                         lectureCount >= 3 &&
                         clickTestPassed;

            return {
              pass,
              detail: `Errors: ${errors.length}, Banner Hidden: ${!bannerVisible}, Countdown: "${afcatCd}", Progress: "${overallProgText}", Week1: ${!!week1}, Day1: ${!!day1}, Day 1 Lecture Links: ${lectureCount} (Target: 3), Click Isolation: ${clickTestPassed}`
            };
          }
        }
      ]);

      // Update Summary Badge
      if (passedTests === totalTests) {
        summaryBadge.className = "summary-badge all-pass";
        summaryBadge.textContent = `ALL ${totalTests} TESTS PASSED (100%)`;
      } else {
        summaryBadge.className = "summary-badge fail";
        summaryBadge.textContent = `${passedTests} / ${totalTests} TESTS PASSED`;
      }
    }

    runAllTests();
  </script>
</body>
</html>
